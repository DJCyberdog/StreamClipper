name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify or install FFmpeg and FFprobe
        shell: bash
        run: |
          set -euo pipefail
          # Hosted runners may already have both. Avoid the apt mirror
          # refresh bottleneck in every pull-request test run.
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "Using runner-provided FFmpeg and FFprobe"
          else
            echo "Installing missing FFmpeg/FFprobe with bounded apt steps"
            timeout 600s sudo apt-get -o Acquire::Retries=2 update
            timeout 600s sudo apt-get -o Acquire::Retries=2 install -y ffmpeg
          fi
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev,twitch]'
      - name: Run tests
        run: python -m pytest -q
      - name: Validate Python syntax
        run: python -m compileall -q src
