name: Windows portable build
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[gui,build,dev,models]"
      - name: Verify or install FFmpeg and FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress --execution-timeout=300
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
            $env:PATH = "$env:ChocolateyInstall\bin;$env:PATH"
            "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg not available" }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw "FFprobe not available" }
          python -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe')"
      - name: Verify desktop GUI and timeline offscreen
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PYTHONFAULTHANDLER = "1"
          python -m pytest -q tests/test_timeline_qt.py tests/test_highlight_lexicon_qt.py tests/test_m11_editor_qt.py tests/test_m11_workspace_qt.py tests/test_m11_checkpoints_qt.py tests/test_m11_unified_history_qt.py tests/test_m11_import_qt.py tests/test_m11_proxy_qt.py tests/test_m10_hf_qt.py tests/test_m12_render_qt.py tests/test_m12_audio_qt.py tests/test_m12_workspace_docks_qt.py tests/test_m12_unified_timeline_qt.py tests/test_m12_visual_qt.py tests/test_m12_encoder_qt.py tests/test_m12de_queue_qt.py tests/test_m13_director_qt.py
          $testExit = $LASTEXITCODE
          Write-Host "Qt pytest exit: $testExit"
          if ($testExit -ne 0) { throw "Qt pytest exited $testExit" }
      - name: Verify render and model core in separate Python process
        shell: pwsh
        run: |
          $env:PYTHONFAULTHANDLER = "1"
          python -m pytest -q tests/test_model_download_progress.py tests/test_hf_credentials.py tests/test_m12_render_contract.py tests/test_m12_audio_graph.py tests/test_m12_audio_ffmpeg.py tests/test_m12_workspace_layout.py tests/test_m12_visual_graph.py tests/test_m12_visual_ffmpeg.py tests/test_m12_encoder_profiles.py tests/test_m12_encoder_fallback_ffmpeg.py tests/test_m12d_export_qa.py tests/test_m12e_render_queue.py tests/test_scene_selection.py tests/test_scene_region_monitor.py tests/test_m13a_scene_render.py tests/test_smart_director.py tests/test_overlay_recognition.py tests/test_inpainting_metrics.py tests/test_vace_inpainting.py tests/test_scene_restoration.py tests/test_m13_combined_render.py tests/test_m14_caption_style.py tests/test_m14_translation.py tests/test_m14_callouts.py tests/test_m14_thumbnail_branding.py
          $testExit = $LASTEXITCODE
          Write-Host "Core pytest exit: $testExit"
          if ($testExit -ne 0) { throw "Core pytest exited $testExit" }
      - name: Verify M15 original audio and remix in separate Python process
        if: ${{ always() }}
        shell: pwsh
        run: |
          $env:PYTHONFAULTHANDLER = "1"
          python -m pytest -q tests/test_m15_audio_sources.py tests/test_m15_speech_timing.py tests/test_m15_audio_separation.py tests/test_m15_target_speaker.py tests/test_m15_review_editor_benchmark.py tests/test_m15_corpus.py tests/test_m16_intelligence.py tests/test_m16_hardware.py tests/test_object_tracking.py tests/test_m17_story_montage.py
          $testExit = $LASTEXITCODE
          Write-Host "M15 pytest exit: $testExit"
          if ($testExit -ne 0) { throw "M15 pytest exited $testExit" }
      - name: Build portable Windows executable
        shell: pwsh
        run: |
          $iconArgs = @()
          if (Test-Path assets/StreamClipper.ico) { $iconArgs = @('--icon','assets/StreamClipper.ico') }
          pyinstaller --noconfirm --clean --onedir --windowed --name StreamClipper --paths src @iconArgs scripts/launch.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          if (Test-Path assets/StreamClipper.ico) {
            New-Item -ItemType Directory -Force dist/StreamClipper/assets | Out-Null
            Copy-Item assets/StreamClipper.ico dist/StreamClipper/assets/
          }
      - name: Include startup notes
        shell: pwsh
        run: |
          Copy-Item docs/WINDOWS-START.txt dist/StreamClipper/START-HERE.txt
          Compress-Archive -Path dist/StreamClipper/* -DestinationPath StreamClipper-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StreamClipper-windows-portable
          path: StreamClipper-windows-portable.zip
          if-no-files-found: error
