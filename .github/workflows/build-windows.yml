name: Windows portable build
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[gui,build,dev,models]"
      - name: Verify desktop GUI and timeline offscreen
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest -q tests/test_timeline_qt.py tests/test_highlight_lexicon_qt.py tests/test_m11_editor_qt.py tests/test_m11_workspace_qt.py tests/test_m11_checkpoints_qt.py tests/test_m11_unified_history_qt.py tests/test_m11_import_qt.py tests/test_m11_proxy_qt.py tests/test_m10_hf_qt.py tests/test_model_download_progress.py tests/test_hf_credentials.py tests/test_m12_render_qt.py tests/test_m12_render_contract.py tests/test_m12_audio_graph.py tests/test_m12_audio_qt.py tests/test_m12_audio_ffmpeg.py tests/test_m12_workspace_docks_qt.py tests/test_m12_workspace_layout.py tests/test_m12_unified_timeline_qt.py tests/test_m12_visual_graph.py tests/test_m12_visual_ffmpeg.py tests/test_m12_visual_qt.py tests/test_m12_encoder_profiles.py tests/test_m12_encoder_fallback_ffmpeg.py tests/test_m12_encoder_qt.py tests/test_m12d_export_qa.py tests/test_m12e_render_queue.py tests/test_m12de_queue_qt.py
      - name: Build portable Windows executable
        run: pyinstaller --noconfirm --clean --onedir --windowed --name StreamClipper --paths src scripts/launch.py
      - name: Include startup notes
        shell: pwsh
        run: |
          Copy-Item docs/WINDOWS-START.txt dist/StreamClipper/START-HERE.txt
          Compress-Archive -Path dist/StreamClipper/* -DestinationPath StreamClipper-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StreamClipper-windows-portable
          path: StreamClipper-windows-portable.zip
          if-no-files-found: error
