[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamclipper"
version = "0.4.0"
description = "Offline gaming stream highlight finder and gaming clip exporter for Windows"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7", "Pillow>=10.1,<13", "psutil>=6,<9", "numpy>=1.26,<3"]
dev = ["pytest>=8,<10", "Pillow>=10.1,<13", "numpy>=1.26,<3", "soundfile>=0.12,<1", "soxr>=0.3,<2"]
build = ["PyInstaller>=6.11,<7"]
speech = ["faster-whisper>=1.1,<3", "av>=11,<18", "soundfile>=0.12,<1", "soxr>=0.3,<2"]
vision = ["torch>=2.3", "transformers>=4.46,<6", "Pillow>=10.1,<13", "timm>=1.0,<2"]
models = ["huggingface-hub>=0.24,<2"]
twitch = ["yt-dlp>=2025.1", "obsws-python>=1.7,<2"]
separation = ["inworld-voice-isolation==1.0.0", "numpy>=1.26,<3", "soundfile>=0.12,<1"]
benchmark = ["psutil>=6,<9"]
target-speaker = ["voxlock==1.3.0", "numpy>=1.26,<3", "soundfile>=0.12,<1", "soxr>=0.3,<2"]
translation = ["torch>=2.3", "transformers>=4.46,<5", "sentencepiece>=0.2,<1", "sacremoses>=0.1,<1"]
inpainting = ["diffusers==0.36.0", "accelerate>=1.2,<2", "transformers>=4.46,<5", "torch>=2.3", "Pillow>=10.1,<13", "sentencepiece>=0.2,<1", "ftfy>=6,<7"]

[project.scripts]
streamclipper-cli = "streamclipper.cli:main"
streamclipper = "streamclipper.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
