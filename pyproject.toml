[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamclipper"
version = "0.2.1"
description = "Offline gaming stream highlight finder and vertical clip exporter for Windows"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
dev = ["pytest>=8,<10"]
build = ["PyInstaller>=6.11,<7"]
speech = ["faster-whisper>=1.1,<3"]
vision = ["torch>=2.3", "transformers>=4.46,<6", "Pillow>=10,<13"]
models = ["huggingface-hub>=0.24,<2"]

[project.scripts]
streamclipper-cli = "streamclipper.cli:main"
streamclipper = "streamclipper.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
